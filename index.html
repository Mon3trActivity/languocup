<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>烂果杯词条随机抽取宾果</title>
<style>
  /* ============================================================
     基础变量 & 全局
     ============================================================ */
  :root{
    --bg-0:          #070a12;
    --cell-bg-a:     rgba(255,255,255,.075);
    --cell-bg-b:     rgba(255,255,255,.028);
    --cell-border:   rgba(140,170,255,.22);
    --text-main:     #e9eefb;
    --text-dim:      #b9c6e6;
    --cyan:          #22d3ee;
    --indigo:        #6366f1;
    --purple:        #a855f7;
  }

  *{ box-sizing: border-box; }

  html, body{ min-height: 100%; }

  body{
    margin: 0;
    background: var(--bg-0);
    color: var(--text-main);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* ============================================================
     背景层：深蓝紫底 + 缓慢流动的光斑 + 细密圆点纹理
     ============================================================ */
  .bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, #16203c 0%, #0b1020 46%, #070a12 100%);
  }

  .bg::before{
    content: "";
    position: absolute;
    inset: -25%;
    background:
      radial-gradient(closest-side, rgba(34,211,238,.17), transparent 70%) 18% 20% / 55% 55% no-repeat,
      radial-gradient(closest-side, rgba(168,85,247,.17), transparent 70%) 82% 28% / 60% 60% no-repeat,
      radial-gradient(closest-side, rgba(99,102,241,.15), transparent 70%) 55% 88% / 65% 65% no-repeat;
    animation: drift 26s ease-in-out infinite alternate;
    will-change: transform;
  }

  .bg::after{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(80% 70% at 50% 42%, #000 25%, transparent 100%);
            mask-image: radial-gradient(80% 70% at 50% 42%, #000 25%, transparent 100%);
  }

  @keyframes drift{
    0%   { transform: translate3d(-2%, -1%, 0) scale(1); }
    100% { transform: translate3d(3%, 2%, 0) scale(1.08); }
  }

  /* ============================================================
     主体布局
     ============================================================ */
  .wrap{
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 3.2vw, 32px);
    padding: clamp(22px, 4vw, 48px) 16px;
  }

  /* ---------- 标题 ---------- */
  .title{
    margin: 0;
    text-align: center;
    font-size: clamp(22px, 4.6vw, 40px);
    font-weight: 800;
    letter-spacing: .07em;
    line-height: 1.3;
    background: linear-gradient(100deg, #8be9ff 0%, #c4b5fd 48%, #ffd88a 100%);
    -webkit-background-clip: text;
            background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 18px rgba(99,102,241,.5));
    user-select: none;
  }

  /* ============================================================
     5 × 5 宾果表格
     ============================================================ */
  .board{
    width: min(92vw, 560px);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(5px, 1.1vw, 11px);
  }

  .cell{
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;                 /* 正方形格子 */
    border-radius: clamp(8px, 1.6vw, 16px);
    background: linear-gradient(160deg, var(--cell-bg-a), var(--cell-bg-b));
    border: 1px solid var(--cell-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    color: var(--text-dim);
    font-size: clamp(10px, 3.2vw, 14px);
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      background   .28s ease,
      border-color .28s ease,
      color        .28s ease,
      box-shadow   .30s ease,
      transform    .20s cubic-bezier(.34, 1.56, .64, 1);
  }

  /* ---------- 卡片两面：正面标题 / 背面正文 ---------- */
  .cell-face{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
    pointer-events: none;               /* 点击事件始终落在 .cell 上 */
    transition: opacity .28s ease, transform .28s ease;
  }

  .cell-text{
    display: -webkit-box;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-align: center;
    overflow-wrap: anywhere;
    line-height: 1.25;
    max-width: 100%;
  }

  /* 正面：标题 */
  .cell-front{
    opacity: 1;
    transform: scale(1);
  }
  .cell-front .cell-text{
    -webkit-line-clamp: 4;
  }

  /* 背面：正文（字号略小、行数略多） */
  .cell-back{
    opacity: 0;
    transform: scale(.9);
  }
  .cell-back .cell-text{
    -webkit-line-clamp: 6;
    font-size: .82em;
    font-weight: 500;
    line-height: 1.2;
    opacity: .95;
  }

  /* ---------- 悬停：有正文时才翻面 ---------- */
  @media (hover: hover){
    .cell:not(.no-body):hover .cell-front{
      opacity: 0;
      transform: scale(.9);
    }
    .cell:not(.no-body):hover .cell-back{
      opacity: 1;
      transform: scale(1);
    }
  }

  /* ---------- 键盘聚焦：与悬停行为一致 ---------- */
  .cell:not(.no-body):focus-visible .cell-front{
    opacity: 0;
    transform: scale(.9);
  }
  .cell:not(.no-body):focus-visible .cell-back{
    opacity: 1;
    transform: scale(1);
  }

  /* ---------- 刷新时的翻牌 / 缩放弹出动画 ---------- */
  .cell.enter{
    animation: cellIn .45s cubic-bezier(.22, 1, .36, 1) backwards;
  }
  @keyframes cellIn{
    from{ opacity: 0; transform: scale(.55) translateY(10px); filter: blur(3px); }
    to  { opacity: 1; transform: scale(1) translateY(0);      filter: blur(0);   }
  }

  /* ---------- 悬停浮起反馈 ---------- */
  @media (hover: hover){
    .cell:hover{
      transform: translateY(-3px) scale(1.04);
      background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      border-color: rgba(150, 205, 255, .5);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.38), 0 0 18px rgba(56,189,248,.22);
    }
  }

  /* ---------- 选中态 ---------- */
  .cell.selected{
    background: linear-gradient(145deg,
                rgba(34,211,238,.94) 0%,
                rgba(99,102,241,.94) 55%,
                rgba(168,85,247,.94) 100%);
    border-color: rgba(255,255,255,.78);
    color: #ffffff;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.28),
      0 8px 26px rgba(56,189,248,.45),
      0 0 26px rgba(168,85,247,.38);
    text-shadow: 0 1px 8px rgba(8,16,45,.5);
  }

  /* ---------- 点击缩放回弹 ---------- */
  .cell.bounce{
    animation: cellBounce .34s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes cellBounce{
    0%   { transform: scale(1);   }
    40%  { transform: scale(.90); }
    100% { transform: scale(1);   }
  }

  /* ---------- 点击涟漪 ---------- */
  .ripple{
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle,
                rgba(255,255,255,.80) 0%,
                rgba(160,220,255,.38) 45%,
                transparent 72%);
    pointer-events: none;
    animation: rippleOut .55s ease-out forwards;
  }
  @keyframes rippleOut{
    from{ opacity: .95; transform: translate(-50%, -50%) scale(0); }
    to  { opacity: 0;   transform: translate(-50%, -50%) scale(1); }
  }

  /* ============================================================
     底部按钮
     ============================================================ */
  .draw-btn{
    position: relative;
    overflow: hidden;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: clamp(12px, 1.6vw, 16px) clamp(30px, 6vw, 54px);
    border-radius: 999px;
    font-size: clamp(15px, 2vw, 18px);
    font-weight: 700;
    letter-spacing: .12em;
    white-space: nowrap;
    color: #fff;
    background: linear-gradient(120deg, #06b6d4 0%, #6366f1 52%, #a855f7 100%);
    box-shadow:
      0 10px 26px rgba(79,70,229,.42),
      inset 0 1px 0 rgba(255,255,255,.42);
    transition:
      transform  .20s cubic-bezier(.34, 1.56, .64, 1),
      box-shadow .25s ease,
      filter     .25s ease;
  }

  .draw-btn::after{
    content: "";
    position: absolute;
    top: 0;
    left: -65%;
    width: 45%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    transform: skewX(-18deg);
    transition: left .55s ease;
    pointer-events: none;
  }

  .draw-btn:hover{
    transform: translateY(-3px) scale(1.035);
    box-shadow:
      0 16px 34px rgba(79,70,229,.55),
      inset 0 1px 0 rgba(255,255,255,.55);
    filter: brightness(1.07);
  }
  .draw-btn:hover::after{ left: 130%; }

  .draw-btn:active{
    transform: translateY(0) scale(.96);
    box-shadow: 0 6px 16px rgba(79,70,229,.45), inset 0 1px 0 rgba(255,255,255,.35);
  }

  .draw-btn:focus-visible{
    outline: 2px solid #7dd3fc;
    outline-offset: 3px;
  }

  /* ============================================================
     响应式微调
     ============================================================ */
  @media (max-width: 420px){
    .board{ gap: 5px; }
    .cell{ border-radius: 8px; }
    .cell-face{ padding: 3px; }
    .wrap{ gap: 16px; }
  }

  /* 尊重系统的「减少动效」设置 */
  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

  <!-- 装饰性背景层 -->
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap">
    <h1 class="title">仙术杯词条随机抽取宾果</h1>

    <!-- 5 × 5 表格由 JS 动态渲染 -->
    <section id="board" class="board" aria-label="宾果表格"></section>

    <button id="drawBtn" class="draw-btn" type="button">随机抽取</button>
  </main>

<script>
/* ================================================================
   1. 词条数据源
   ----------------------------------------------------------------
   每个词条包含：
     - id    : 唯一编号（用于去重判断）
     - title : 标题（默认显示在格子上）
     - body  : 正文（鼠标悬停 / 键盘聚焦时显示）

   👉 在此处继续添加词条，格式：
      { id: 序号, title: "标题", body: "正文说明" },
   ================================================================ */
const BINGO_DATA = [
  { id: 1,  title: "登峰造极", body: "以难度 n15 通关游戏" },
  { id: 2,  title: "指引α",   body: "携带沙盘α通关" },
  { id: 3,  title: "指引β",   body: "携带沙盘β通关" },
  { id: 4,  title: "证毕",     body: "完成结局“混沌源阶理论”" },
  { id: 5,  title: "奇美拉",   body: "完成结局“畸症”" },
  { id: 6,  title: "空城计",   body: "不携带干员通过“畸症”（可以带 1 炎国干员用于触发天师锦囊）" },
  { id: 7,  title: "最终防线", body: "通关时血量为 1，盾量为 0" },
  { id: 8,  title: "完美主义", body: "全程完美作战" },
  { id: 9,  title: "背水一战", body: "全程不使用医疗干员" },
  { id: 10, title: "嚼嚼嚼",   body: "击杀 15 条猎犬 pro" },
  { id: 11, title: "会心一击", body: "一击超过一百万" },
  { id: 12, title: "大运的力量", body: "累计入坑 10 名敌人" },
  { id: 13, title: "静默猎手", body: "至少触发 3 次追猎" },
  { id: 14, title: "本源研习", body: "触发过所有的元素爆发" },
  { id: 15, title: "行万里路", body: "走过黑流树海的 19 种节点类型" },
  { id: 16, title: "植物学家", body: "获得过至少 10 种自然物" },
  { id: 17, title: "动物学家", body: "获得过所有概念体" },
  { id: 18, title: "礼帽",     body: "不偷偷摸坎诺特的商品" },
  { id: 19, title: "小苹果",   body: "先锋干员全程不被击倒" },
  { id: 20, title: "大胃戴",   body: "“玻利瓦尔，症结之核”、“洛伦茨，扰动之谬”或“卡德霍，黑流之源”进入目标点" },
  { id: 21, title: "短兵相接", body: "通关时携带至少 5 位六星近卫 / 重装 / 先锋 / 特种" },
  { id: 22, title: "远程打击", body: "通关时携带至少 5 位六星狙击 / 术士 / 医疗 / 辅助" },
  { id: 23, title: "均衡",     body: "每个职业最多只能抓取 1 名六星干员（包括机械师）" },
  { id: 24, title: "极速之手", body: "2 小时内通关游戏" },
  { id: 25, title: "心急如焚", body: "全程 2 倍速通关" },
  { id: 26, title: "赫鲁晓夫", body: "结算时拥有 9 个及以上回声玉米" },
  { id: 27, title: "神秘数字", body: "在关卡内干员造成的伤害量、治疗量符合某些特殊数字" },
  // 👉 在此处继续添加词条，格式： { id: 26, title: "标题", body: "正文" },
];

/* 表格规格 */
const GRID_SIZE  = 5;
const CELL_COUNT = GRID_SIZE * GRID_SIZE;   // 25

/* DOM 引用 */
const boardEl = document.getElementById('board');
const drawBtn = document.getElementById('drawBtn');

/* ================================================================
   2. 工具函数：数组洗牌（Fisher–Yates）
   ================================================================ */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ================================================================
   3. 抽取逻辑：随机取出 25 个词条对象
   - 词条库为空  → 全部返回占位对象「？」
   - 词条不足 25 → 允许重复，但通过「分轮洗牌」尽量分散，
                   并避免相邻两个格子出现同一个词条
   ================================================================ */
function pickEntries(count){
  // 清洗数据：只保留 title 非空的词条
  const items = BINGO_DATA
    .filter(item => item && typeof item.title === 'string' && item.title.trim())
    .map(item => ({
      id: item.id,
      title: item.title.trim(),
      body: (typeof item.body === 'string' ? item.body.trim() : '')
    }));

  // 词条库为空：全部占位
  if(items.length === 0){
    return Array.from({ length: count }, () => ({ id: -1, title: '？', body: '' }));
  }

  const result = [];
  let pool = [];   // 当前这一轮尚未使用的词条

  while(result.length < count){
    if(pool.length === 0){
      pool = shuffle(items.slice());

      // 避免「上一轮最后一个」与「这一轮第一个」重复
      const last = result[result.length - 1];
      if(pool.length > 1 && last && pool[0].id === last.id){
        [pool[0], pool[1]] = [pool[1], pool[0]];
      }
    }
    result.push(pool.shift());
  }

  return result;
}

/* ================================================================
   4. 渲染表格：每个格子包含「正面标题」+「背面正文」两层
   ================================================================ */
function renderBoard(entries){
  const frag = document.createDocumentFragment();

  entries.forEach((entry, index) => {
    const cell = document.createElement('div');
    cell.className = 'cell enter';                 // enter：入场动画
    cell.setAttribute('role', 'button');
    cell.setAttribute('tabindex', '0');
    cell.setAttribute('aria-pressed', 'false');
    cell.style.animationDelay = (index * 22) + 'ms';  // 依次淡入的错峰延迟

    // 没有正文时，悬停不翻面（避免显示空白）
    if(!entry.body){
      cell.classList.add('no-body');
    }

    // 正面：标题
    const front = document.createElement('div');
    front.className = 'cell-face cell-front';
    const frontText = document.createElement('span');
    frontText.className = 'cell-text';
    frontText.textContent = entry.title || '？';
    front.appendChild(frontText);

    // 背面：正文
    const back = document.createElement('div');
    back.className = 'cell-face cell-back';
    const backText = document.createElement('span');
    backText.className = 'cell-text';
    backText.textContent = entry.body || '';
    back.appendChild(backText);

    cell.appendChild(front);
    cell.appendChild(back);

    // 点击 / 键盘交互
    cell.addEventListener('click', ev => handleCellClick(cell, ev));
    cell.addEventListener('keydown', ev => {
      if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
        ev.preventDefault();
        handleCellClick(cell, null);   // 键盘触发：涟漪从中心扩散
      }
    });

    // 入场动画结束后移除动画类，避免影响 hover / 点击的 transform
    cell.addEventListener('animationend', ev => {
      if(ev.animationName === 'cellIn'){
        cell.classList.remove('enter');
        cell.style.animationDelay = '';
      }
    });

    frag.appendChild(cell);
  });

  boardEl.innerHTML = '';
  boardEl.appendChild(frag);
}

/* ================================================================
   5. 生成一次点击涟漪特效
   ================================================================ */
function spawnRipple(cell, ev){
  const rect = cell.getBoundingClientRect();

  const x = (ev && typeof ev.clientX === 'number')
    ? ev.clientX - rect.left
    : rect.width  / 2;
  const y = (ev && typeof ev.clientY === 'number')
    ? ev.clientY - rect.top
    : rect.height / 2;

  const size = Math.max(rect.width, rect.height) * 1.9;

  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width  = size + 'px';
  ripple.style.height = size + 'px';
  ripple.style.left   = x + 'px';
  ripple.style.top    = y + 'px';

  cell.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

/* ================================================================
   6. 点击格子：切换选中状态 + 点击特效
   ================================================================ */
function handleCellClick(cell, ev){
  // ① 涟漪扩散
  spawnRipple(cell, ev);

  // ② 缩放回弹（先移除再强制重排，保证动画可重复触发）
  cell.classList.remove('bounce');
  void cell.offsetWidth;
  cell.classList.add('bounce');

  // ③ 切换选中态
  const selected = cell.classList.toggle('selected');
  cell.setAttribute('aria-pressed', selected ? 'true' : 'false');
}

/* ================================================================
   7. 随机抽取：重新填满整张表并清除所有选中状态
   ================================================================ */
function draw(){
  renderBoard(pickEntries(CELL_COUNT));   // 重建即等于清除全部选中状态
}

/* ================================================================
   8. 初始化
   ================================================================ */
drawBtn.addEventListener('click', draw);
draw();   // 页面初始化时自动抽取一次
</script>
</body>
</html>
